[build]
  # Default freeze remains. Only a reviewed independent TEST site + exact
  # approved commit can pass both gates; the protected old site always fails.
  ignore = "node scripts/test-build-gate.cjs"
  command = "node scripts/build-test.cjs"
  publish = "out"

[build.environment]
  NODE_VERSION = "24.22.2"
  NPM_VERSION = "11.19.1"
  NODE_ENV = "production"

[functions]
  directory = "netlify/functions"
  node_bundler = "zisi"
  included_files = ["netlify/functions/_shared/test-resource-binding.json", "netlify/functions/_generated/test-deploy.json"]

# Preserve the script bytes used by the generated static CSP.
[build.processing]
  skip_processing = true

# 增强安全头部
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-DNS-Prefetch-Control = "on"
    # 内容安全策略
    # CSP is generated once in out/_headers after static export; TOML would override it.
    # 严格传输安全
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # 权限策略
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()"
    # 防止MIME类型嗅探
    X-Download-Options = "noopen"
    # 其他安全设置
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"
    
# 静态资源缓存优化
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/_next/image/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    
# 图片资源缓存
[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
    
[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
    
[[headers]]
  for = "*.gif"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
    
[[headers]]
  for = "*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
    
# 字体缓存
[[headers]]
  for = "*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
    
[[headers]]
  for = "*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# HTML页面安全策略
[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
    Pragma = "no-cache"
    X-Robots-Tag = "noindex, nofollow"

# API路径保护
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
    X-Robots-Tag = "noindex, nofollow"
    # CORS is handled by each Function; do not grant a site-wide cross-origin API policy.

# Static export: existing files (including /guides/index.html) use Netlify file shadowing.
# Unknown routes must be genuine 404s instead of rewriting to the homepage.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
