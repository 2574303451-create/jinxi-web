<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>本机合成成员身份验证 · 今夕</title><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/community.css"><link rel="stylesheet" href="/demo.css"><script src="/demo.js" defer></script></head>
<body class="jinxi-site"><main class="guild-shell local-member"><header><span class="guild-badge">第三阶段 · 仅本机合成验证</span><h1>成员身份验证</h1><p>本页使用独立本机合成账号。请勿输入真实公会账号或密码。</p><p>只验证登录、本人资料、改密与退出；合成会话不会登录旧站或云端 TEST。</p></header>
<p id="status" class="paper-notice" role="status" aria-live="polite">正在核验本机会话…</p>
<section class="guild-panel"><h2>服务器会话</h2><form id="login"><label for="account">合成账号</label><select id="account" name="account"><option value="synthetic-normal">普通合成成员</option><option value="synthetic-first">首次改密 · 旧算法格式</option><option value="synthetic-locked">锁定合成账号</option><option value="synthetic-disabled">停用合成成员</option><option value="synthetic-same">同昵称另一成员</option></select><label for="password">本机合成密码</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required><p>密码由启动程序生成，仅保存在本机私有文件；不写入本页或浏览器存储。</p><button class="paper-button yellow">登录</button></form>
<div id="member" hidden><p id="identity"></p><p id="reset-note"></p><div class="actions"><button type="button" id="profile" class="paper-button">读取本人资料</button><button type="button" id="refresh" class="paper-button">重新核验</button><button type="button" id="logout" class="paper-button dark">退出此会话</button></div><dl id="profile-data"></dl>
<form id="change"><h3>修改本机合成密码</h3><label for="current">当前密码</label><input id="current" type="password" autocomplete="current-password" maxlength="128" required><label for="next">新密码</label><input id="next" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><p>12–128 个字符，包含字母、数字及符号。成功后所有旧设备会话撤销。</p><button class="paper-button yellow">修改密码</button></form></div></section>
<section class="guild-panel"><h2>草稿保留验证</h2><label for="draft">本机草稿</label><textarea id="draft" maxlength="2000" rows="4"></textarea><p>只保存这段草稿。旧 localStorage 账号、昵称不作为身份；退出、过期和断网不会主动删除草稿。</p></section>
</main></body></html>
