name: B2 security checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: b2-checks-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    name: Security / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['24.22.2']
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jinxi_005sb1_admin
          POSTGRES_PASSWORD: ci-synthetic-only
          POSTGRES_DB: jinxi_005s_b1_test
        ports: ['55433:5432']
        options: >-
          --health-cmd "pg_isready -U jinxi_005sb1_admin -d jinxi_005s_b1_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: 'true'
      JINXI_CI_PG: synthetic-55433
      JINXI_CI_PG_PASSWORD: ci-synthetic-only
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record tested Git revision
        run: git rev-parse HEAD
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Record tested toolchain
        run: |
          node --version
          npm --version
      - name: Verify clean npm launcher on Linux
        run: node scripts/run-clean.cjs --version
      - run: npm ci
      - name: Verify synthetic access and historical compatibility
        run: |
          npm run test:integration-unit
          npm run test:adaptation
          node --test tests/synthetic-cloud-boundary.test.cjs tests/synthetic-cloud-access.test.mjs synthetic-cloud/gate-only/gate.test.mjs synthetic-cloud/gate-only/manual.test.mjs synthetic-cloud/gate-only/upload-manifest.test.mjs
      - name: Run synthetic transaction and package rehearsals on PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux ]]
          pg_bin=/usr/lib/postgresql/17/bin
          if [[ ! -x "$pg_bin/postgres" ]]; then
            key="$RUNNER_TEMP/jinxi-pgdg.asc"
            curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
              --output "$key" https://www.postgresql.org/media/keys/ACCC4CF8.asc
            fingerprint="$(gpg --batch --show-keys --with-colons "$key" |
              awk -F: '$1 == "pub" {primary=1} $1 == "fpr" && primary {print $10; primary=0}')"
            [[ "$fingerprint" == B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8 ]]
            sudo install -m 0644 "$key" /usr/share/keyrings/jinxi-pgdg.asc
            source_list=/etc/apt/sources.list.d/jinxi-pgdg.list
            printf '%s\n' 'deb [signed-by=/usr/share/keyrings/jinxi-pgdg.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' |
              sudo tee "$source_list" >/dev/null
            sudo install -d /etc/postgresql-common/createcluster.d
            printf '%s\n' 'create_main_cluster = false' |
              sudo tee /etc/postgresql-common/createcluster.d/jinxi-ci.conf >/dev/null
            sudo apt-get update -o Dir::Etc::sourcelist="$source_list" -o Dir::Etc::sourceparts=-
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends postgresql-17
          fi
          "$pg_bin/postgres" --version | grep -E '^postgres \(PostgreSQL\) 17\.'
          openssl_bin="$(command -v openssl)"
          node tests/points-local-review-postgres.test.cjs --pg-bin "$pg_bin"
          node tests/adaptation-postgres.test.cjs --pg-bin "$pg_bin" --openssl "$openssl_bin"
          node tests/synthetic-cloud-database.test.cjs --pg-bin "$pg_bin" --openssl "$openssl_bin"
          node tests/synthetic-cloud-https.test.cjs --pg-bin "$pg_bin" --openssl "$openssl_bin"
      - name: Raw TypeScript check
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts-ci
          npm run typecheck | tee artifacts-ci/typescript.txt
      - run: npm run build
      - name: Verify production export isolation
        run: node --test tests/integration-local-export.test.cjs tests/adaptation-export.test.cjs
      - run: npm run test
      - name: Verify isolated video demo policy and loopback assets
        run: node --test artifacts/b2-a-8/video-demo/policy.test.cjs
      - run: npm run lint
      - name: Initialize isolated ephemeral PostgreSQL
        run: node scripts/ci-postgres.cjs
      - name: Actual SQL, identity, session and tampering regressions
        run: npm run test:integration
      - name: Upload sanitized TypeScript reports only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typescript-${{ matrix.node }}
          path: artifacts-ci/typescript.txt
          include-hidden-files: false
          if-no-files-found: warn
          retention-days: 7
