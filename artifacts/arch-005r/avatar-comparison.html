<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARCH-005R 头像原框比较</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#f7f7f5;color:#151515;font-family:Arial,'Microsoft YaHei',sans-serif}h1{margin:0;font-size:24px}p{font-size:14px;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}article{min-width:0;background:white;border:2px solid;border-radius:12px;padding:12px}h2{font-size:16px;margin:0 0 12px}img{display:block;width:100%;height:auto}small{display:block;margin-top:10px;line-height:1.6}</style><h1>头像只换图，不换框 · 390px 实际浏览器</h1><p>合成账号与同一条留言/回复。框尺寸及卡片几何独立测量，未使用真实玩家头像。</p><div class="grid"><article><h2>原文字头像</h2><img src="avatar-wall-text-390.png"><small>留言42px / 回复30px；保留原颜色标记。</small></article><article><h2>基线问题</h2><img src="baseline-avatar-wall-photo-390.png"><small>照片替换了整个外框：均变32px，角标丢失。</small></article><article><h2>修复后照片</h2><img src="avatar-wall-photo-390.png"><small>外框/角标/卡片不变，仅填充内部图片。</small></article></div></html>
