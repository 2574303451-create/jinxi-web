<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>本机合成留言与攻略 · 今夕</title><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/community.css"><link rel="stylesheet" href="/business.css"><script src="/business.js" defer></script></head>
<body class="jinxi-site"><main class="guild-shell business-shell">
<header><span class="guild-badge">第三阶段检查点2 · 仅本机合成数据</span><h1>留言与攻略验证</h1><p>登录和权限由本机服务器核验。此页不会恢复旧站或云端写入。</p><p><a href="/">合成身份登录、改密与退出</a></p><p id="session" aria-live="polite">正在核验身份…</p></header>
<p id="notice" role="status" aria-live="polite">正在读取公开内容…</p><div class="actions"><button id="retry" type="button" hidden>重试原请求</button><button id="cancel" type="button" hidden>停止重试（不撤销已完成操作）</button></div>
<section class="guild-panel"><h2>创建或修订合成内容</h2><form id="compose">
<label for="kind">内容类型</label><select id="kind"><option value="message">留言</option><option value="guide">攻略</option></select>
<div id="guide-fields" hidden><label for="title">攻略标题</label><input id="title" maxlength="100"><label for="category">攻略分类</label><select id="category"><option>PVP</option><option selected>PVE</option><option>新手向/老玩家回归</option><option>装备</option><option>战力系统</option><option>副本</option><option>活动</option><option>其他</option></select><label for="difficulty">难度</label><select id="difficulty"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option></select><label for="tags">标签（逗号分隔，最多10个）</label><input id="tags"><label class="checkbox"><input id="fixture-media" type="checkbox">附上固定的本机合成封面与视频引用</label></div>
<label for="body">正文（纯文本或Markdown源文，不接受HTML）</label><textarea id="body" rows="5" maxlength="10000" required></textarea><p id="editing">作者来自当前服务器会话，不填写昵称或成员ID。</p><div class="actions"><button class="paper-button yellow" type="submit">保存合成内容</button><button id="new" type="button">取消修订</button></div></form></section>
<section class="guild-panel"><h2>内容与操作状态</h2><p>留言保存后待审核；攻略先保存草稿。按钮用于验证服务端权限，普通成员的审核和管理请求会被拒绝。</p><div class="filters"><label for="scope">读取范围</label><select id="scope"><option value="public">公开内容</option><option value="mine">本人内容</option><option value="review">待审核队列</option></select><button id="reload" type="button">重新读取并核验</button></div><p id="loading" role="status" hidden>正在读取…</p><div id="items" aria-live="polite"></div></section>
</main></body></html>
