name: B2 security checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: b2-checks-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    name: Security / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['24.22.2']
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jinxi_005sb1_admin
          POSTGRES_PASSWORD: ci-synthetic-only
          POSTGRES_DB: jinxi_005s_b1_test
        ports: ['55433:5432']
        options: >-
          --health-cmd "pg_isready -U jinxi_005sb1_admin -d jinxi_005s_b1_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: 'true'
      JINXI_CI_PG: synthetic-55433
      JINXI_CI_PG_PASSWORD: ci-synthetic-only
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record tested Git revision
        run: git rev-parse HEAD
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Raw TypeScript check
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts-ci
          npm run typecheck | tee artifacts-ci/typescript.txt
      - run: npm run build
      - run: npm run test
      - run: npm run lint
      - name: Initialize isolated ephemeral PostgreSQL
        run: node scripts/ci-postgres.cjs
      - name: Actual SQL, identity, session and tampering regressions
        run: npm run test:integration
      - name: Upload sanitized TypeScript reports only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typescript-${{ matrix.node }}
          path: artifacts-ci/typescript.txt
          include-hidden-files: false
          if-no-files-found: warn
          retention-days: 7
